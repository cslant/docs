name: Deploy CSlant Server

on:
  push:
    branches:
      - main

# The build and the sync both happen inside the directory nginx serves, so two
# overlapping runs leave the live site referencing chunks that were deleted by
# the other run.
concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to Remote Host
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST_WEB_2 }}
          username: ${{ secrets.REMOTE_USERNAME_WEB_2 }}
          password: ${{ secrets.REMOTE_PASS_WEB_2 }}
          key: ${{ secrets.SSH_PRIVATE_KEY_WEB_2 }}
          port: ${{ secrets.REMOTE_PORT_WEB_2 }}
          script: |
            source "$HOME/.nvm/nvm.sh"
            nvm use ${{ vars.GLOBAL_NVM_USE_VERSION }}
            cd ${{ secrets.DOCS_RUNNER_PATH }}
            ${{ secrets.DOCS_RUNNER_COMMAND }}

  sync-build:
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Sync build
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST_WEB_2 }}
          username: ${{ secrets.REMOTE_USERNAME_WEB_2 }}
          password: ${{ secrets.REMOTE_PASS_WEB_2 }}
          key: ${{ secrets.SSH_PRIVATE_KEY_WEB_2 }}
          port: ${{ secrets.REMOTE_PORT_WEB_2 }}
          script: |
            # --delay-updates stages every file and renames them in one pass at
            # the end, and --delete-after keeps the previous chunks on disk until
            # the new ones are all in place. Without both, the web root spends
            # the whole transfer missing files that live pages are requesting.
            rsync -avz --delay-updates --delete-after ${{ vars.DOCS_PATH_WEB_2 }}/build/ ${{ vars.NGINX_SERVER_NAME }}:${{ vars.NGINX_SERVER_SYNC_PATH }}/docs/
